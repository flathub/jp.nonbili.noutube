app-id: jp.nonbili.noutube
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: run.sh
separate-locales: false
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --own-name=org.mpris.MediaPlayer2.chromium.*
modules:
  - name: noutube
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/run/build/noutube/bin
      env:
        VITE_BUILD_TARGET: portable
    build-commands:
      - bun run bundle
      - |
        cd desktop
        bun electron-vite build
        bun electron-builder --dir --publish never --config.electronDist=../node_modules/electron/dist2
        cp -a dist/linux*unpacked /app/main

      - install -Dm755 -t /app/bin/ ./run.sh
      - install -Dm644 metadata/flatpak/jp.nonbili.noutube.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 metadata/flatpak/jp.nonbili.noutube.desktop -t /app/share/applications/
      - install -Dm644 desktop/icon.png /app/share/icons/hicolor/512x512/apps/jp.nonbili.noutube.png
    sources:
      - type: archive
        url: https://github.com/nonbili/NouTube-Desktop/releases/download/v0.2.11/source.tar.gz
        sha256: c691d13dead57b255e3d9b247504d1c3fb4bccc8df8ed499758dc253e6e0b12c
        strip-components: 0

      - type: archive
        url: https://github.com/nonbili/NouTube-Desktop/releases/download/v0.2.11/node_modules-x64.tar.gz
        sha256: a75daf7bc5be0ef9970710dd27b8dbf179bfc65d270fb11ada5d30d545a6c8ac
        dest: node_modules
        only-arches: [x86_64]

      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.1/bun-linux-x64.zip
        sha256: 400824c82bfcc0854365bcada11cf53d7384ecb1e2c3da0e2c0a2c6a527d5629
        dest: bin
        only-arches: [x86_64]

      - type: archive
        url: https://github.com/electron/electron/releases/download/v39.2.7/electron-v39.2.7-linux-x64.zip
        sha256: 2f5285ef563dca154aa247696dddef545d3d895dd9b227ed423ea0d43737c22c
        strip-components: 0
        dest: node_modules/electron/dist2
        only-arches: [x86_64]

      - type: archive
        url: https://github.com/nonbili/NouTube-Desktop/releases/download/v0.2.11/node_modules-arm64.tar.gz
        sha256: 47e5e64654cf2615c8ce4a03902dd9932bf905b5ba7deb923e7d0ab6e5aff971
        dest: node_modules
        only-arches: [aarch64]

      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.1/bun-linux-aarch64.zip
        sha256: 65666a18439e891e5751b666103fe591a8519f11b66ec4bd8654c5515d4fff8a
        dest: bin
        only-arches: [aarch64]

      - type: archive
        url: https://github.com/electron/electron/releases/download/v39.2.7/electron-v39.2.7-linux-arm64.zip
        sha256: 445465a43bd2ffaec09877f4ed46385065632a4683c2806cc6211cc73c110024
        strip-components: 0
        dest: node_modules/electron/dist2
        only-arches: [aarch64]

      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/NouTube "$@"
