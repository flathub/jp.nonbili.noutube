app-id: jp.nonbili.noutube
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: run.sh
separate-locales: false
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --own-name=org.mpris.MediaPlayer2.chromium.*
modules:
  - name: noutube
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/run/build/noutube/bin
      env:
        VITE_BUILD_TARGET: portable
    build-commands:
      - bun run bundle
      - |
        cd desktop
        bun electron-vite build
        bun electron-builder --dir --publish never --config.electronDist=../node_modules/electron/dist2
        cp -a dist/linux*unpacked /app/main

      - install -Dm755 -t /app/bin/ ./run.sh
      - install -Dm644 metadata/flatpak/jp.nonbili.noutube.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 metadata/flatpak/jp.nonbili.noutube.desktop -t /app/share/applications/
      - install -Dm644 desktop/icon.png /app/share/icons/hicolor/512x512/apps/jp.nonbili.noutube.png
    sources:
      - type: archive
        url: https://github.com/nonbili/NouTube-Desktop/releases/download/v0.3.2/source.tar.gz
        sha256: 338f1aec1494c7ceeabda1d7ba86631bba8cd42b1021794ea303e6a6f86f1ff0
        strip-components: 0

      - type: archive
        url: https://github.com/nonbili/NouTube-Desktop/releases/download/v0.3.2/node_modules-x64.tar.gz
        sha256: c28548685a77150043c1d9347adb08df771073c365169922455cd0c6b78c3e91
        dest: node_modules
        only-arches: [x86_64]

      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.1/bun-linux-x64.zip
        sha256: 400824c82bfcc0854365bcada11cf53d7384ecb1e2c3da0e2c0a2c6a527d5629
        dest: bin
        only-arches: [x86_64]

      - type: archive
        url: https://github.com/electron/electron/releases/download/v43.4.1/electron-v43.4.1-linux-x64.zip
        sha256: 79d4efd69f0ccf1fc11891ea5075329c7b3faddad79a08d9fb395bbd63169acf
        strip-components: 0
        dest: node_modules/electron/dist2
        only-arches: [x86_64]

      - type: archive
        url: https://github.com/nonbili/NouTube-Desktop/releases/download/v0.3.2/node_modules-arm64.tar.gz
        sha256: 0053fe6efe72a4029f67875caf2254d69cf6d1c2a59f35eb5a8470ac84fdbdae
        dest: node_modules
        only-arches: [aarch64]

      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.1/bun-linux-aarch64.zip
        sha256: 65666a18439e891e5751b666103fe591a8519f11b66ec4bd8654c5515d4fff8a
        dest: bin
        only-arches: [aarch64]

      - type: archive
        url: https://github.com/electron/electron/releases/download/v43.4.1/electron-v43.4.1-linux-arm64.zip
        sha256: 9e2b5cfbd387e138f06c7bb19b399bb3ee487dbb4110215df097d94e80431892
        strip-components: 0
        dest: node_modules/electron/dist2
        only-arches: [aarch64]

      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/main/noutube "$@"
